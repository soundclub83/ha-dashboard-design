# HA Dashboard Design 0.1.4
# Gemeinsame dunkle Designbasis. Anwendung pro Ansicht.
HA Dashboard Design:
  dashboard-design-version: "0.1.4"
  design-background: "#121b22"
  design-surface: "#1f2c34"
  design-text: "#d5dee6"
  design-muted: "#83949f"
  design-accent: "#00a884"
  lovelace-background: "var(--design-background)"
  primary-background-color: "var(--design-background)"
  secondary-background-color: "var(--design-background)"
  primary-color: "var(--design-accent)"
  accent-color: "var(--design-accent)"
  primary-text-color: "var(--design-text)"
  secondary-text-color: "var(--design-muted)"
  disabled-text-color: "var(--design-muted)"
  divider-color: "rgba(255,255,255,.08)"
  app-header-background-color: "var(--design-surface)"
  app-header-text-color: "var(--design-text)"
  app-header-edit-background-color: "var(--design-surface)"
  app-header-edit-text-color: "var(--design-text)"
  sidebar-background-color: "var(--design-surface)"
  sidebar-text-color: "var(--design-text)"
  sidebar-icon-color: "var(--design-muted)"
  sidebar-selected-text-color: "var(--design-accent)"
  sidebar-selected-icon-color: "var(--design-accent)"
  paper-item-icon-color: "var(--design-muted)"
  paper-item-icon-active-color: "var(--design-accent)"
  mdc-theme-surface: "var(--design-surface)"
  mdc-theme-background: "var(--design-background)"
  mdc-theme-primary: "var(--design-accent)"
  mdc-theme-on-surface: "var(--design-text)"
  # Nur Mini Media Player; keine allgemeinen ha-card-Vorgaben.
  design-media-background: "rgba(145,165,185,.025)"
  design-media-border: "1px solid rgba(145,170,190,.035)"
  design-media-radius: "16px"
  design-media-text: "#d5dee6"
  design-media-muted: "#a1b4c2"
  design-media-accent: "#6cdbc9"
  mini-media-player-accent-color: "var(--design-media-accent)"
  mini-media-player-base-color: "var(--design-media-text)"
  card-mod-theme: "HA Dashboard Design"
  card-mod-card: |
    {% if config is defined and config.type is defined and config.type == 'custom:mini-media-player' %}
    :host {
      --mini-media-player-accent-color: var(--design-media-accent);
      --mini-media-player-base-color: var(--design-media-text);
    }
    ha-card {
      background: var(--design-media-background) !important;
      border: var(--design-media-border) !important;
      border-radius: var(--design-media-radius) !important;
      box-shadow: none !important;
      --primary-text-color: var(--design-media-text);
      --secondary-text-color: var(--design-media-muted);
      --mini-media-player-accent-color: var(--design-media-accent);
      --mini-media-player-base-color: var(--design-media-text);
    }
    .mmp__bg { background: transparent !important; }
    {% endif %}
  # HA-eigene Panels, Tabellen, Eingaben und Dialoge.
  design-admin-surface: "#1f2c34"
  design-admin-border: "rgba(155,180,200,.16)"
  design-admin-radius: "16px"
  design-input-background: "#243540"
  design-menu-background: "#243540"
  ha-panel-background: "var(--design-background)"
  ha-panel-toolbar-background: "var(--design-surface)"
  ha-data-table-background: "var(--design-admin-surface)"
  data-table-background-color: "var(--design-admin-surface)"
  table-header-background-color: "var(--design-admin-surface)"
  table-row-background-color: "var(--design-admin-surface)"
  table-row-alternative-background-color: "var(--design-surface)"
  ha-dialog-surface-background: "var(--design-admin-surface)"
  ha-dialog-border-radius: "var(--design-admin-radius)"
  input-fill-color: "var(--design-input-background)"
  input-disabled-fill-color: "rgba(145,165,185,.06)"
  input-ink-color: "var(--design-text)"
  input-label-ink-color: "var(--design-muted)"
  input-dropdown-icon-color: "var(--design-muted)"
  input-idle-line-color: "var(--design-admin-border)"
  input-hover-line-color: "var(--design-muted)"
  input-outlined-idle-border-color: "var(--design-admin-border)"
  input-outlined-hover-border-color: "var(--design-muted)"
  mdc-dialog-scrim-color: "rgba(0,0,0,.55)"
  markdown-code-background-color: "var(--design-input-background)"
  # ha-panel-config rendert im Light DOM: hier kein :host verwenden.
  card-mod-config: |
    ha-panel-config {
      --card-background-color: var(--design-admin-surface);
      --ha-card-background: var(--design-admin-surface);
      --ha-card-border-radius: var(--design-admin-radius);
      --ha-card-border-color: var(--design-admin-border);
      --ha-card-border-width: 1px;
      --ha-card-box-shadow: none;
    }
  card-mod-dialog: |
    :host {
      --card-background-color: var(--design-admin-surface);
      --ha-card-background: var(--design-admin-surface);
      --mdc-theme-surface: var(--design-menu-background);
    }
  card-mod-more-info: |
    :host {
      --card-background-color: var(--design-admin-surface);
      --mdc-theme-surface: var(--design-menu-background);
    }
  modes:
    dark: {}
    light: {}
