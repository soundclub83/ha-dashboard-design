# HA Dashboard Design 0.1.0
# Gemeinsame dunkle Designbasis. Anwendung pro Ansicht.
HA Dashboard Design:
  dashboard-design-version: "0.1.0"
  design-background: "#121b22"
  design-surface: "#1f2c34"
  design-text: "#d5dee6"
  design-muted: "#83949f"
  design-accent: "#00a884"
  design-status-name: "#6cdbc9"
  design-card-background: "linear-gradient(145deg,rgba(37,53,65,.75),rgba(22,34,44,.94))"
  design-card-radius: "24px"
  design-card-shadow: "0 6px 24px rgba(0,0,0,.10)"
  design-item-background: "rgba(145,165,185,.055)"
  design-item-radius: "16px"
  design-card-padding: "12px"
  design-item-gap: "8px"
  design-title-size: "22px"
  design-header-line: "linear-gradient(90deg,rgba(255,170,80,.65),rgba(255,170,80,.18))"
  lovelace-background: "var(--design-background)"
  primary-background-color: "var(--design-background)"
  secondary-background-color: "var(--design-background)"
  card-background-color: "var(--design-surface)"
  ha-card-background: "var(--design-card-background)"
  ha-card-border-radius: "var(--design-card-radius)"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(155,180,200,.10)"
  ha-card-box-shadow: "var(--design-card-shadow)"
  primary-color: "var(--design-accent)"
  accent-color: "var(--design-accent)"
  primary-text-color: "var(--design-text)"
  secondary-text-color: "var(--design-muted)"
  disabled-text-color: "var(--design-muted)"
  divider-color: "rgba(255,255,255,.08)"
  app-header-background-color: "var(--design-surface)"
  app-header-text-color: "var(--design-text)"
  app-header-edit-background-color: "var(--design-surface)"
  app-header-edit-text-color: "var(--design-text)"
  sidebar-background-color: "var(--design-surface)"
  sidebar-text-color: "var(--design-text)"
  sidebar-icon-color: "var(--design-muted)"
  sidebar-selected-text-color: "var(--design-accent)"
  sidebar-selected-icon-color: "var(--design-accent)"
  paper-item-icon-color: "var(--design-muted)"
  paper-item-icon-active-color: "var(--design-accent)"
  mdc-theme-surface: "var(--design-surface)"
  mdc-theme-background: "var(--design-background)"
  mdc-theme-primary: "var(--design-accent)"
  mdc-theme-on-surface: "var(--design-text)"
  room-control-background: "var(--design-card-background)"
  room-control-radius: "var(--design-card-radius)"
  room-control-padding: "var(--design-card-padding)"
  room-control-gap: "var(--design-item-gap)"
  room-control-text: "var(--design-text)"
  room-control-muted: "#8293a2"
  room-control-item-background: "var(--design-item-background)"
  room-control-item-radius: "var(--design-item-radius)"
  room-control-title-size: "var(--design-title-size)"
  room-control-header-line: "var(--design-header-line)"
  room-control-status-name: "var(--design-status-name)"
  modes:
    dark: {}
    light: {}
