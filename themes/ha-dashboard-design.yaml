# HA Dashboard Design 0.1.6
# Gemeinsame dunkle Designbasis. Anwendung pro Ansicht.
HA Dashboard Design:
  dashboard-design-version: "0.1.6"
  design-background: "#121b22"
  design-surface: "#1f2c34"
  design-text: "#d5dee6"
  design-muted: "#83949f"
  design-accent: "#00a884"
  lovelace-background: "var(--design-background)"
  primary-background-color: "var(--design-background)"
  secondary-background-color: "var(--design-background)"
  primary-color: "var(--design-accent)"
  accent-color: "var(--design-accent)"
  primary-text-color: "var(--design-text)"
  secondary-text-color: "var(--design-muted)"
  disabled-text-color: "var(--design-muted)"
  divider-color: "rgba(255,255,255,.08)"
  app-header-background-color: "var(--design-surface)"
  app-header-text-color: "var(--design-text)"
  app-header-edit-background-color: "var(--design-surface)"
  app-header-edit-text-color: "var(--design-text)"
  sidebar-background-color: "var(--design-surface)"
  sidebar-text-color: "var(--design-text)"
  sidebar-icon-color: "var(--design-muted)"
  sidebar-selected-text-color: "var(--design-accent)"
  sidebar-selected-icon-color: "var(--design-accent)"
  paper-item-icon-color: "var(--design-muted)"
  paper-item-icon-active-color: "var(--design-accent)"
  mdc-theme-surface: "var(--design-surface)"
  mdc-theme-background: "var(--design-background)"
  mdc-theme-primary: "var(--design-accent)"
  mdc-theme-on-surface: "var(--design-text)"
  # Gezielt abweichendes Design ausschließlich für Mini Media Player.
  design-media-background: "rgba(145,165,185,.025)"
  design-media-border: "1px solid rgba(145,170,190,.035)"
  design-media-radius: "16px"
  design-media-text: "#d5dee6"
  design-media-muted: "#a1b4c2"
  design-media-accent: "#6cdbc9"
  mini-media-player-accent-color: "var(--design-media-accent)"
  mini-media-player-base-color: "var(--design-media-text)"
  # Gezielt genutzte Designwerte für Wetterrahmen, Wetterinhalt und DWD-Warnungen.
  design-weather-background: "linear-gradient(145deg,rgba(37,53,65,.75),rgba(22,34,44,.94))"
  design-weather-border: "1px solid rgba(155,180,200,.10)"
  design-weather-radius: "24px"
  design-weather-shadow: "0 6px 24px rgba(0,0,0,.10)"
  design-weather-padding: "12px"
  design-weather-text: "#d5dee6"
  design-weather-muted: "#91a4b3"
  design-weather-accent: "#edc47a"
  design-weather-inner-radius: "16px"
  design-weather-header-height: "32px"
  design-weather-header-size: "17px"
  design-weather-header-weight: "600"
  design-weather-header-icon-size: "20px"
  design-weather-header-icon-margin: "4px 12px"
  design-weather-header-title-gap: "18px"
  design-weather-header-line: "linear-gradient(90deg,rgba(255,170,80,.55),rgba(255,170,80,.15))"
  design-warning-radius: "20px"
  design-warning-padding: "16px"
  design-warning-font-size: "1.05rem"
  design-warning-line-height: "1.4"
  design-warning-title-size: "18px"
  design-warning-level-0-rgb: "76,175,80"
  design-warning-level-1-rgb: "253,216,53"
  design-warning-level-2-rgb: "251,140,0"
  design-warning-level-3-rgb: "229,57,53"
  design-warning-level-4-rgb: "136,14,79"
  design-warning-background-opacity: "0.15"
  design-warning-border-opacity: "0.4"
  card-mod-theme: "HA Dashboard Design"
  card-mod-card: |
    {% if config is defined and config.type is defined and config.type == 'custom:mini-media-player' %}
    :host {
      --mini-media-player-accent-color: var(--design-media-accent);
      --mini-media-player-base-color: var(--design-media-text);
    }
    ha-card {
      background: var(--design-media-background) !important;
      border: var(--design-media-border) !important;
      border-radius: var(--design-media-radius) !important;
      box-shadow: none !important;
      --primary-text-color: var(--design-media-text);
      --secondary-text-color: var(--design-media-muted);
      --mini-media-player-accent-color: var(--design-media-accent);
      --mini-media-player-base-color: var(--design-media-text);
    }
    .mmp__bg { background: transparent !important; }
    {% endif %}
    {% if config is defined and config.type is defined and config.type == 'custom:button-card' and config.design_role | default('') == 'weather-frame' %}
    ha-card {
      padding: var(--design-weather-padding);
      border-radius: var(--design-weather-radius);
      background: var(--design-weather-background);
      border: var(--design-weather-border);
      box-shadow: var(--design-weather-shadow);
      overflow: visible;
    }
    {% endif %}
    {% if config is defined and config.type is defined and config.type == 'custom:clock-weather-card' %}
    ha-card {
      background: transparent !important;
      border: none !important;
      border-radius: var(--design-weather-inner-radius) !important;
      box-shadow: none !important;
      --primary-text-color: var(--design-weather-text);
      --secondary-text-color: var(--design-weather-muted);
      --accent-color: var(--design-weather-accent);
    }
    {% endif %}
    {% if config is defined and config.type is defined and config.type == 'markdown' and config.design_role | default('') == 'dwd-warning' %}
    ha-card {
      background-color: rgba(var(--design-warning-rgb, var(--design-warning-level-0-rgb)), var(--design-warning-background-opacity));
      border: 1px solid rgba(var(--design-warning-rgb, var(--design-warning-level-0-rgb)), var(--design-warning-border-opacity));
      border-radius: var(--design-warning-radius);
      padding: var(--design-warning-padding);
      box-shadow: none;
      white-space: normal !important;
      word-break: break-word !important;
      height: auto !important;
      overflow: visible !important;
    }
    ha-markdown { line-height: var(--design-warning-line-height); font-size: var(--design-warning-font-size); margin-bottom: 0 !important; }
    ha-markdown h2 { font-size: var(--design-warning-title-size) !important; font-weight: 600 !important; line-height: 1.3 !important; margin-top: 0 !important; }
    {% endif %}
  # HA-eigene Panels, Tabellen, Eingaben und Dialoge.
  design-admin-surface: "#1f2c34"
  design-admin-border: "rgba(155,180,200,.16)"
  design-admin-radius: "16px"
  design-input-background: "#243540"
  design-menu-background: "#243540"
  ha-panel-background: "var(--design-background)"
  ha-panel-toolbar-background: "var(--design-surface)"
  ha-data-table-background: "var(--design-admin-surface)"
  data-table-background-color: "var(--design-admin-surface)"
  table-header-background-color: "var(--design-admin-surface)"
  table-row-background-color: "var(--design-admin-surface)"
  table-row-alternative-background-color: "var(--design-surface)"
  ha-dialog-surface-background: "var(--design-admin-surface)"
  ha-dialog-border-radius: "var(--design-admin-radius)"
  input-fill-color: "var(--design-input-background)"
  input-disabled-fill-color: "rgba(145,165,185,.06)"
  input-ink-color: "var(--design-text)"
  input-label-ink-color: "var(--design-muted)"
  input-dropdown-icon-color: "var(--design-muted)"
  input-idle-line-color: "var(--design-admin-border)"
  input-hover-line-color: "var(--design-muted)"
  input-outlined-idle-border-color: "var(--design-admin-border)"
  input-outlined-hover-border-color: "var(--design-muted)"
  mdc-dialog-scrim-color: "rgba(0,0,0,.55)"
  markdown-code-background-color: "var(--design-input-background)"
  # ha-panel-config rendert im Light DOM: hier kein :host verwenden.
  card-mod-config: |
    ha-panel-config {
      --card-background-color: var(--design-admin-surface);
      --ha-card-background: var(--design-admin-surface);
      --ha-card-border-radius: var(--design-admin-radius);
      --ha-card-border-color: var(--design-admin-border);
      --ha-card-border-width: 1px;
      --ha-card-box-shadow: none;
    }
  card-mod-dialog: |
    :host {
      --card-background-color: var(--design-admin-surface);
      --ha-card-background: var(--design-admin-surface);
      --mdc-theme-surface: var(--design-menu-background);
    }
  card-mod-more-info: |
    :host {
      --card-background-color: var(--design-admin-surface);
      --mdc-theme-surface: var(--design-menu-background);
    }
  # Globale Standardflächen; lokale Karten-CSS-Regeln bleiben vorrangig.
  card-background-color: "var(--design-surface)"
  ha-card-background: "var(--design-surface)"
  rgb-card-background-color: "31, 44, 52"
  clear-background-color: "var(--design-background)"
  paper-dialog-background-color: "var(--design-admin-surface)"
  paper-listbox-background-color: "var(--design-menu-background)"
  material-background-color: "var(--design-admin-surface)"
  material-secondary-background-color: "var(--design-background)"
  modes:
    dark: {}
    light: {}
